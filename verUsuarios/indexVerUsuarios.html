<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários</title>

    <link rel="stylesheet" href="styleVerUsuarios.css">
</head>

<body>

    <div class="usuarios-container">

        
        <a href="../usuarios/indexUsuarios.html" class="botao-voltar">
            ← Voltar para Meu Perfil
        </a>


        
        <section class="usuarios-topo">

            <div>
                <p class="subtitulo-topo" id="perfilLogado"></p>

                <h1>Usuários</h1>

                <p class="descricao-topo">
                    Consulte os usuários cadastrados no sistema.
                </p>
            </div>

            
            <div class="campo-busca">
                <input
                    type="text"
                    id="buscarUsuario"
                    placeholder="Buscar usuário..."
                >
            </div>

        </section>


        
        <section class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Usuário</th>
                        <th>E-mail</th>
                        <th>Cargo</th>
                    </tr>
                </thead>

                <tbody id="listaUsuarios"></tbody>

            </table>

        </section>

    </div>

    <script src="scriptVerUsuarios.js"></script>
</body>

</html>
