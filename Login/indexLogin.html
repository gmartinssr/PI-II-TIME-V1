<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styleLogin.css" rel="stylesheet">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="d-flex flex-wrap justify-content-center py-4 mb-4">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 text-decoration-none">
            <span class="fs-2">Workflow</span>
        </a>
    </header>

    <div class = "corpo"> 
        <div class = "card_login">
            
            <div class = "login_header">
                <h2>Login</h2>
                <p>Entre na sua conta para continuar</p>
            </div>

            <div class = "login_form">
                <div class = "Email">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Digite seu Email...">
                </div>

                <div class = "Senha">
                    <label>Senha</label>
                    <input type="password" id = "senha" class = "form-control" placeholder="Digite Sua Senha...">
                </div>
                <button type="button" class="btn-entrar">Entrar</button>
            </div>

        </div>
    </div>

</body>
</html>
