<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap via CDN. Uso mais pro header e pro form-control dos inputs,
    o resto do visual eu fiz no styleLogin.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styleLogin.css" rel="stylesheet">
</head>

<body>
  
    <!-- Topo só com o nome do sistema.
    O link aponta pra essa mesma tela, então só recarrega a página -->
    <header class="d-flex flex-wrap justify-content-center py-4 mb-4">
        <a href="indexLogin.html" class="d-flex align-items-center mb-3 mb-md-0 text-decoration-none">
            <span class="fs-2">Workflow</span>
        </a>
    </header>

    <!-- .corpo centraliza o card, o resto do posicionamento tá no CSS -->
    <div class = "corpo"> 
        <div class = "card_login">
            
            <div class = "login_header">
                <h2>Login</h2>
                <p>Entre na sua conta para continuar</p>
            </div>

            <!-- novalidate pra o navegador não mostrar os avisos dele.
            Quem valida é o backend, o JS só exibe o erro que voltar -->
            <form class="login_form" id="formLogin" novalidate>
                <div class = "Email">
                    <label>Email</label>
                    <!-- o JS pega esse campo pelo id "email" -->
                    <input type="email" id="email" class="form-control" placeholder="Digite seu Email...">
                </div>
                <div class = "Senha">
                    <label>Senha</label>
                    <!-- type="password" pra não mostrar o que a pessoa digita -->
                    <input type="password" id = "senha" class = "form-control" placeholder="Digite Sua Senha...">
                </div>
                <!-- Clicar aqui ou apertar Enter dispara o submit que o JS escuta -->
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>

        </div>
    </div>

    <!-- Script por último pra o HTML já ter carregado antes de ele rodar -->
    <script src="scriptLogin.js"></script>
</body>
</html>
