<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="styleUsuarios.css">
</head>
<body>
    <div class="layout">
        <aside class = "sidebar">
                <h2>Workflow</h2>

                <ul>
                    <li>
                        <a href="../Dashboard/indexDashboard.html">Dashboard</a>
                    </li>

                    <li>
                        <a href="../lista-demanda/tela.html">Demandas</a>
                    </li>

                    <li>
                        <a href="../Cadastro/Edição-de-Demandas/Cadastro e edição de demandas.html">Nova Demanda</a>
                    </li>

                    <li>
                        <a href="../ListagemProjetos/indexListagemProjetos.html">Meus Projetos</a>
                    </li>

                    <li>
                        <a href="../usuarios/indexUsuarios.html" class="ativo">Meu Perfil</a>
                    </li>

                    <li>
                        <a href="../Login/indexLogin.html">Sair</a>
                    </li>
                </ul>
        </aside>

        <main>
            <section class="topo">
                <div>
                    <h1>Meu Perfil</h1>
                </div>
            </section>

            <section class="conteudo">
                <div class="card">
                    <h2>Informações do Usuário</h2>
                    <p id="nome"><strong>Nome:</strong> <span></span></p>

                    <p id="email"><strong>Email:</strong> <span></span></p>

                    <p id="usuario"><strong>Usuário:</strong> <span></span></p>

                    <p id="cargo"><strong>Cargo:</strong> <span></span></p>

                    <div class="acoes-perfil">
                        <button class="botao-senha" type="button">Alterar Senha</button>

                        <a href="../verUsuarios/indexVerUsuarios.html" class="botao-usuarios" id="linkUsuarios">
                            Ver Usuários
                        </a>
                    </div>

                    <p class="mensagem-formulario erro" id="avisoUsuarios"></p>
                </div>
            </section>

            <section class="formulario">
                <form class="form-alterar-senha">

                    <div class="campo">
                        <label for="senhaAtual">Senha atual:</label>
                        <input type="password" id="senhaAtual">
                        <span class="mensagem-campo" id="mensagemSenhaAtual"></span>
                    </div>

                    <div class="campo">
                        <label for="novaSenha">Nova senha:</label>
                        <input type="password" id="novaSenha">
                        <span class="mensagem-campo" id="mensagemNovaSenha"></span>
                    </div>

                    <div class="campo">
                        <label for="confirmarSenha">Confirmar nova senha:</label>
                        <input type="password" id="confirmarSenha">
                        <span class="mensagem-campo" id="mensagemConfirmarSenha"></span>
                    </div>

                    <button type="submit" class="botao-salvar-senha">
                        Salvar nova senha
                    </button>
                    <p class="mensagem-formulario" id="mensagemFormulario"></p>

                </form>
            </section>
        </main>
    </div>
    <script src="scriptUsuarios.js"></script>
</body>
</html>
